name: Deploy

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - ci

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            lambda/package-lock.json
            ui/package-lock.json

      - name: Install Lambda dependencies
        working-directory: lambda
        run: npm ci

      - name: Build Lambda
        working-directory: lambda
        run: npm run build

      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=file-share-terraform-state-mruoc" \
            -backend-config="region=eu-west-2" \
            -backend-config="key=${{ inputs.environment }}/app/terraform.tfstate"

      - name: Terraform Plan
        working-directory: infra
        run: |
          terraform plan \
            -out=tfplan \
            -var="environment=${{ inputs.environment }}"

      - name: Terraform Apply
        working-directory: infra
        run: |
          terraform apply -auto-approve tfplan

      - name: Terraform Outputs
        id: tf
        working-directory: infra
        run: echo "deployment=$(terraform output -json deployment)" >> $GITHUB_OUTPUT

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ fromJson(steps.tf.outputs.deployment).api_endpoint }}
          VITE_ENVIRONMENT: ${{ inputs.environment }}

      - name: Deploy UI
        run: aws s3 sync ui/dist s3://${{ fromJson(steps.tf.outputs.deployment).ui_bucket_name }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ fromJson(steps.tf.outputs.deployment).cloudfront_distribution_id }} \
            --paths "/*"

      - name: Deployment Summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Endpoint | ${{ fromJson(steps.tf.outputs.deployment).api_endpoint }} |" >> $GITHUB_STEP_SUMMARY
          echo "| UI | https://${{ fromJson(steps.tf.outputs.deployment).cloudfront_domain_name }} |" >> $GITHUB_STEP_SUMMARY
